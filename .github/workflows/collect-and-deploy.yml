name: Collect premium data and deploy dashboard

on:
  workflow_dispatch:
    inputs:
      force:
        description: Collect even when the run is outside a configured market slot
        type: boolean
        default: true
  schedule:
    # Beijing time: 09:35, 10:05, 10:35, 11:05, 11:35.
    - cron: "35 1 * * 1-5"
    - cron: "5 2 * * 1-5"
    - cron: "35 2 * * 1-5"
    - cron: "5 3 * * 1-5"
    - cron: "35 3 * * 1-5"
    # Beijing time: 13:05, 13:35, 14:05, 14:35, 15:05.
    - cron: "5 5 * * 1-5"
    - cron: "35 5 * * 1-5"
    - cron: "5 6 * * 1-5"
    - cron: "35 6 * * 1-5"
    - cron: "5 7 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: premium-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The dashboard only needs the current tree. A shallow checkout keeps
          # scheduled runs fast even after the data branch has years of commits.
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Collect current snapshot
        env:
          MANUAL_FORCE: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_FORCE" == "true" ]]; then
            python3 collect_premium_api.py --force
          else
            python3 collect_premium_api.py
          fi

      - name: Build dashboard data
        run: python3 build_dashboard_data.py

      - name: Commit new history
        run: |
          if git diff --quiet -- data; then
            echo "No new market snapshot to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: collect LOF premium snapshot"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
