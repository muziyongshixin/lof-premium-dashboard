name: Collect premium data and deploy dashboard

on:
  workflow_dispatch:
    inputs:
      force:
        description: Collect even when the run is outside a configured market slot
        type: boolean
        default: true
      collect_volume:
        description: Update completed daily volume from TDX
        type: boolean
        default: true
      refresh_volume_history:
        description: Re-fetch recent volume history (diagnostics or corrections)
        type: boolean
        default: false
  schedule:
    # Beijing time: 09:35, 10:05, 10:35, 11:05, 11:35.
    - cron: "35 1 * * 1-5"
    - cron: "5 2 * * 1-5"
    - cron: "35 2 * * 1-5"
    - cron: "5 3 * * 1-5"
    - cron: "35 3 * * 1-5"
    # Beijing time: 13:05, 13:35, 14:05, 14:35, 15:05.
    - cron: "5 5 * * 1-5"
    - cron: "35 5 * * 1-5"
    - cron: "5 6 * * 1-5"
    - cron: "35 6 * * 1-5"
    - cron: "5 7 * * 1-5"
    # Daily volume: 16:10 Beijing, with an idempotent catch-up at 18:10.
    - cron: "10 8 * * 1-5"
    - cron: "10 10 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: premium-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The dashboard only needs the current tree. A shallow checkout keeps
          # scheduled runs fast even after the data branch has years of commits.
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Test collection and chart semantics
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/chart.test.cjs

      - name: Collect current snapshot
        if: github.event.schedule != '10 8 * * 1-5' && github.event.schedule != '10 10 * * 1-5'
        env:
          MANUAL_FORCE: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_FORCE" == "true" ]]; then
            python3 collect_premium_api.py --force
          else
            python3 collect_premium_api.py
          fi

      - name: Collect completed daily volume
        if: github.event.schedule == '10 8 * * 1-5' || github.event.schedule == '10 10 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.collect_volume)
        env:
          REFRESH_VOLUME: ${{ inputs.refresh_volume_history }}
        run: |
          if [[ "$REFRESH_VOLUME" == "true" ]]; then
            python3 collect_daily_volume.py --refresh-history
          else
            python3 collect_daily_volume.py
          fi

      - name: Build dashboard data
        run: python3 build_dashboard_data.py

      - name: Commit new history
        run: |
          git add data
          if git diff --staged --quiet; then
            echo "No new premium or daily volume data to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: update LOF premium and daily volume"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
